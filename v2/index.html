<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Demira Dental Clinic | Home (v2 concept)</title>
<meta name="description" content="Trusted dental care for the whole family in Mulund West, Mumbai. Website design preview.">
<meta property="og:title" content="Demira Dental Clinic">
<meta property="og:description" content="Trusted dental care for the whole family. Website design preview.">
<meta name="theme-color" content="#0E2B2C">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0;background:#F7F2EC}
*{box-sizing:border-box}
a{color:#7A5B3A}a:hover{color:#5C4329}
.serif{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-0.01em}
.ph{background-size:cover;background-position:center;background-repeat:no-repeat}
.ph-hero{background:url(assets/hero.jpg) 50% 35%/cover no-repeat,#16393A}
.ph-smile{background:url(assets/smile.jpg) 18% 60%/cover no-repeat,#E3CDB4}
.ph-clinic{background:url(assets/dentist.jpg) 58% 50%/cover no-repeat,#D7E2DE}
.ph-room{background:url(assets/room.jpg) 62% 40%/cover no-repeat,#0F2D2E}
.ph-aligner{background:url(assets/aligner.jpg) 72% 40%/cover no-repeat,#E1E8E5}
.ph-kids{background:url(assets/kids.jpg) 48% 50%/cover no-repeat,#EBDCCB}
.ph-doc1{background:url(assets/doc1.jpg) 50% 25%/cover no-repeat,#CFDCD8}
.ph-doc2{background:url(assets/doc2.jpg) 50% 25%/cover no-repeat,#DDCDBB}
.ph-doc3{background:url(assets/doc3.jpg) 50% 20%/cover no-repeat,#CBD8DD}
.ph-cta{background:url(assets/smile.jpg) 22% 58%/cover no-repeat,#0B2223}
.map{background-color:#E9EEEC;background-image:linear-gradient(#DCE4E1 2px,transparent 2px),linear-gradient(90deg,#DCE4E1 2px,transparent 2px),linear-gradient(35deg,transparent 48%,#F7F2EC 48%,#F7F2EC 53%,transparent 53%),linear-gradient(-60deg,transparent 47%,#FFFFFF 47%,#FFFFFF 51%,transparent 51%);background-size:64px 64px,64px 64px,100% 100%,100% 100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;font:500 15px Inter,system-ui,sans-serif;text-decoration:none;border:0;cursor:pointer;transition:transform .25s ease,background .25s ease,box-shadow .25s ease}
.btn:hover{transform:translateY(-2px)}
.btn-bronze{background:#8A6A47;color:#fff;box-shadow:0 10px 24px rgba(138,106,71,.28)}.btn-bronze:hover{background:#755939;color:#fff}
.btn-ink{background:#13201F;color:#fff}.btn-ink:hover{background:#000;color:#fff}
.btn-white{background:#fff;color:#13201F}.btn-white:hover{background:#F7F2EC;color:#13201F}
.btn-glass{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(10px)}.btn-glass:hover{background:rgba(255,255,255,.22);color:#fff}
.btn-line{background:transparent;color:#13201F;border:1px solid #CFC5B8}.btn-line:hover{border-color:#13201F;color:#13201F}
.arrow{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.18)}
.nav a.navl{color:#13201F;text-decoration:none;font:500 14px Inter,system-ui,sans-serif;padding:10px 14px;border-radius:999px;transition:background .2s}
.nav a.navl:hover{background:#F2ECE4}
.field{width:100%;height:50px;padding:0 16px;border:1px solid #E7DFD5;border-radius:14px;background:#FBF8F4;font:15px Inter,system-ui,sans-serif;color:#13201F;transition:border-color .2s,background .2s}
.field:focus{outline:none;border-color:#8A6A47;background:#fff;box-shadow:0 0 0 4px rgba(138,106,71,.14)}
.slot{flex:1 1 0;min-height:48px;border-radius:12px;font:500 13px Inter,system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;transition:all .2s}
.slot-off{background:#FBF8F4;color:#13201F;border:1px solid #E7DFD5}.slot-off:hover{border-color:#8A6A47}
.slot-on{background:#13201F;color:#fff;border:1px solid #13201F}
.lift{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}.lift:hover{transform:translateY(-6px);box-shadow:0 24px 48px rgba(19,32,31,.10)}
.svc .svc-img{transition:transform .6s cubic-bezier(.2,.7,.2,1)}.svc:hover .svc-img{transform:scale(1.05)}
.svc .more{opacity:0;transform:translateY(8px);transition:all .3s}.svc:hover .more{opacity:1;transform:none}
.track{display:flex;gap:56px;width:max-content;animation:marq 38s linear infinite}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.scroller{scrollbar-width:none}.scroller::-webkit-scrollbar{display:none}
.wa{position:fixed;right:24px;bottom:24px;z-index:50;width:60px;height:60px;border-radius:50%;background:#1F7A4D;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px rgba(31,122,77,.35);transition:transform .25s}.wa:hover{transform:scale(1.06);color:#fff}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #C9A97F;outline-offset:2px}
</style>
<style>.wa{display:flex}@media(max-width:760px){.nav nav{display:none !important}}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; font-family: Inter, system-ui, sans-serif; color: #4A5553; background: #F7F2EC; font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased">

<!-- ============ HERO ============ -->
<section style="padding: 16px">
<div class="ph ph-hero" style="position: relative; border-radius: 36px; overflow: hidden; min-height: 860px; display: flex; flex-direction: column">
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,26,26,.28) 0%, rgba(8,26,26,0) 26%, rgba(8,26,26,0) 46%, rgba(8,26,26,.86) 100%), linear-gradient(90deg, rgba(8,26,26,.55) 0%, rgba(8,26,26,0) 52%)" aria-hidden="true"></div>

<header class="nav" style="position: relative; z-index: 2; margin: 20px 20px 0; background: rgba(255,255,255,.94); backdrop-filter: blur(16px); border-radius: 999px; padding: 10px 10px 10px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.08)">
<a href="#" aria-label="Demira Dental Clinic home" style="display: inline-flex; align-items: center; gap: 12px; text-decoration: none">
<img src="assets/mark.png" alt="" style="height: 38px; width: auto">
<img src="assets/wordmark.png" alt="Demira" style="height: 14px; width: auto">
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 2px">
<a class="navl" href="#">About</a>
<a class="navl" href="#">Treatments</a>
<a class="navl" href="#">Doctors</a>
<a class="navl" href="#">Gallery</a>
<a class="navl" href="#">Reviews</a>
<a class="navl" href="#">FAQs</a>
<a class="navl" href="#">Contact</a>
</nav>
<div style="display: flex; align-items: center; gap: 8px">
<a href="tel:+91XXXXXXXXXX" style="display: inline-flex; align-items: center; gap: 8px; color: #13201F; text-decoration: none; font-weight: 500; font-size: 14px; padding: 0 12px; min-height: 44px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>+91 98XXX XXXXX</a>
<a class="btn btn-ink" href="#book" style="min-height: 46px; padding: 0 22px">Book a visit</a>
</div>
</header>

<div style="position: relative; z-index: 1; flex: 1 1 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 40px; padding: 32px 56px 56px; align-items: stretch">
<div style="display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: 640px">
<div style="display: inline-flex; align-items: center; gap: 14px; align-self: flex-start; background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.22); backdrop-filter: blur(10px); padding: 6px 16px 6px 6px; border-radius: 999px">
<span style="display: flex">
<span style="width: 32px; height: 32px; border-radius: 50%; background: #E3CDB4; border: 2px solid #1A3A3A; display: inline-flex"></span>
<span style="width: 32px; height: 32px; border-radius: 50%; background: #A9BDB5; border: 2px solid #1A3A3A; margin-left: -10px; display: inline-flex"></span>
<span style="width: 32px; height: 32px; border-radius: 50%; background: #C9A97F; border: 2px solid #1A3A3A; margin-left: -10px; display: inline-flex"></span>
</span>
<span style="color: #fff; font-size: 14px">Trusted by <strong style="font-weight: 600">5,000+</strong> families in [City]</span>
</div>
<div style="display: flex; flex-direction: column; gap: 24px">
<h1 style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 500; font-size: clamp(48px, 5.6vw, 82px); line-height: .98; letter-spacing: -0.04em; color: #FFFFFF">Gentle dentistry,<br><span class="serif" style="color: #EBD7BE; font-size: 1.08em">beautifully</span> done.</h1>
<p style="margin: 0; max-width: 470px; font-size: 17px; color: rgba(255,255,255,.86)">Expert specialists, spotless hygiene and treatment plans you actually understand — in a clinic designed to feel calm from the moment you walk in.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<a class="btn btn-white" href="#">Explore treatments <span class="arrow" style="background: #13201F; color: #fff"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg></span></a>
<a class="btn btn-glass" href="https://wa.me/91XXXXXXXXXX"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 7.7 19.4z"/></svg>Chat on WhatsApp</a>
</div>
</div>
</div>

<!-- BOOKING CARD -->
<div id="book" style="justify-self: end; width: 100%; max-width: 410px; align-self: start; background: rgba(255,255,255,.96); backdrop-filter: blur(20px); border-radius: 30px; padding: 30px; box-shadow: 0 30px 60px rgba(0,0,0,.22)">
<sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; flex-direction: column; gap: 16px; align-items: flex-start; padding: 8px 0">
<span style="width: 56px; height: 56px; border-radius: 50%; background: #E6EFEA; color: #1F7A4D; display: inline-flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg></span>
<h2 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-weight: 500; font-size: 28px; letter-spacing: -0.02em; color: #13201F; line-height: 1.15">You’re all set, {{firstName}}.</h2>
<p style="margin: 0; font-size: 15px">Our front desk will call or WhatsApp you on <strong style="color: #13201F">{{phone}}</strong> to confirm your <strong style="color: #13201F">{{treatment}}</strong> visit — usually within 2 hours.</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px">
<a class="btn btn-ink" href="{{waLink}}" style="min-height: 46px">Also send on WhatsApp</a>
<button class="btn btn-line" type="button" onClick="{{reset}}" style="min-height: 46px">New request</button>
</div>
</div>
</sc-if>
<sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
<form action="#" onSubmit="{{submit}}" novalidate="" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 4px">
<div>
<h2 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-weight: 500; font-size: 26px; letter-spacing: -0.02em; color: #13201F; line-height: 1.1">Book an appointment</h2>
<p style="margin: 6px 0 0; font-size: 14px; color: #5F6866">Takes under a minute.</p>
</div>
<span style="display: inline-flex; align-items: center; gap: 6px; background: #E6EFEA; color: #1E5B3E; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px; white-space: nowrap"><span style="width: 7px; height: 7px; border-radius: 50%; background: #1F7A4D"></span>Slots today</span>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #13201F">Full name<input class="field" type="text" autocomplete="name" placeholder="Your name" value="{{name}}" onChange="{{onName}}"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #13201F">Mobile number<input class="field" type="tel" autocomplete="tel" placeholder="+91 98XXX XXXXX" value="{{phone}}" onChange="{{onPhone}}"></label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #13201F">Treatment<select class="field" data-options="treatments" value="{{treatment}}" onChange="{{onTreatment}}" style="padding-right: 8px"></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #13201F">Preferred date<input class="field" type="date" value="{{date}}" onChange="{{onDate}}"></label>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span id="slot-lbl" style="font-size: 13px; font-weight: 500; color: #13201F">Preferred time</span>
<div role="group" aria-labelledby="slot-lbl" style="display: flex; gap: 8px">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
<sc-if value="{{s.on}}" hint-placeholder-val="{{ false }}"><button class="slot slot-on" type="button" aria-pressed="true" onClick="{{s.pick}}">{{s.label}}<span style="font-size: 11px; opacity: .75">{{s.time}}</span></button></sc-if>
<sc-if value="{{s.off}}" hint-placeholder-val="{{ true }}"><button class="slot slot-off" type="button" aria-pressed="false" onClick="{{s.pick}}">{{s.label}}<span style="font-size: 11px; color: #5F6866">{{s.time}}</span></button></sc-if>
</sc-for>
</div>
</div>
<sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}"><div role="alert" style="background: #FBEDE8; color: #8A2E1F; border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 500">{{error}}</div></sc-if>
<button class="btn btn-bronze" type="submit" style="width: 100%; margin-top: 4px">Request appointment <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
<div style="display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #5F6866"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Private &amp; secure. We’ll only contact you about this visit.</div>
</form>
</sc-if>
</div>
</div>
</div>
</section>

<!-- ============ MARQUEE ============ -->
<section aria-label="Highlights" style="overflow: hidden; padding: 26px 0; border-bottom: 1px solid #E7DFD5">
<div class="track" style="font-family: 'Inter Tight', sans-serif; font-size: 22px; color: #13201F; letter-spacing: -0.01em; white-space: nowrap">
<sc-for list="{{marquee}}" as="m" hint-placeholder-count="12"><span style="display: inline-flex; align-items: center; gap: 56px">{{m}}<svg width="18" height="18" viewBox="0 0 24 24" fill="#9C7B58" aria-hidden="true"><path d="M12 2l1.8 7.2L21 12l-7.2 1.8L12 22l-1.8-8.2L3 12l7.2-2.8z"/></svg></span></sc-for>
</div>
</section>

<!-- ============ ABOUT + BENTO ============ -->
<section style="max-width: 1320px; margin: 0 auto; padding: 120px 32px 40px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 32px; margin-bottom: 56px">
<div style="max-width: 900px">
<div style="display: inline-flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; letter-spacing: .16em; color: #7A5B3A; margin-bottom: 22px"><span style="width: 28px; height: 1px; background: #9C7B58"></span>ABOUT DEMIRA</div>
<h2 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-weight: 500; font-size: clamp(32px, 3.6vw, 52px); line-height: 1.1; letter-spacing: -0.03em; color: #13201F">Healthy smiles inspire confidence. We’re dedicated to <span style="color: #9A9086">calm, honest, expert dental care — in a space that feels nothing like a clinic.</span></h2>
</div>
<a class="btn btn-line" href="#">Our story</a>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div class="lift" style="flex: 2 1 520px; min-height: 360px; border-radius: 30px; overflow: hidden; background: #0E2B2C; display: flex; position: relative">
<div style="flex: 1 1 50%; padding: 34px; display: flex; flex-direction: column; justify-content: space-between; position: relative; z-index: 1">
<div style="font-size: 11px; font-weight: 600; letter-spacing: .16em; color: #C9B49A">YOUR SMILE, OUR PRIORITY</div>
<div>
<div style="font-family: 'Inter Tight', sans-serif; font-weight: 500; font-size: 30px; line-height: 1.12; letter-spacing: -0.02em; color: #fff; margin-bottom: 20px">Healthy smiles for <span class="serif" style="color: #EBD7BE">every</span> generation</div>
<a class="btn btn-white" href="#" style="min-height: 44px; padding: 0 18px; font-size: 14px">Learn more</a>
</div>
</div>
<div class="ph ph-smile" role="img" aria-label="Close-up of a healthy, natural smile" style="flex: 1 1 50%; min-height: 360px"></div>
</div>
<div class="lift" style="flex: 1 1 240px; min-height: 360px; border-radius: 30px; background: #13201F; padding: 30px; display: flex; flex-direction: column; justify-content: space-between">
<div style="font-size: 11px; font-weight: 600; letter-spacing: .16em; color: #A8B3B0">AVERAGE RATING</div>
<div>
<div style="font-family: 'Inter Tight', sans-serif; font-weight: 500; font-size: 88px; line-height: .9; letter-spacing: -0.05em; color: #fff">4.9</div>
<div style="color: #D9B988; letter-spacing: 4px; margin: 14px 0 8px" aria-label="Five stars">★★★★★</div>
<div style="font-size: 14px; color: #A8B3B0">From 600+ Google reviews by real patients.</div>
</div>
</div>
<div class="lift" style="flex: 1 1 240px; min-height: 360px; border-radius: 30px; background: #FFFFFF; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #ECE4DA">
<div style="font-size: 11px; font-weight: 600; letter-spacing: .16em; color: #7A5B3A">PATIENT SATISFACTION</div>
<div>
<div style="font-family: 'Inter Tight', sans-serif; font-weight: 500; font-size: 88px; line-height: .9; letter-spacing: -0.05em; color: #13201F">98<span style="font-size: 44px; color: #9C7B58">%</span></div>
<div style="height: 6px; border-radius: 6px; background: #F0E9E0; margin: 22px 0 12px; overflow: hidden"><div style="width: 98%; height: 100%; background: linear-gradient(90deg, #C9A97F, #8A6A47); border-radius: 6px"></div></div>
<div style="font-size: 14px; color: #5F6866">Would recommend Demira to family and friends.</div>
</div>
</div>
</div>
</section>

<!-- ============ SERVICES ============ -->
<section style="padding: 80px 16px 0">
<div style="background: #0E2B2C; border-radius: 36px; padding: 88px 0 72px; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; right: -120px; top: -160px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(201,169,127,.22) 0%, rgba(201,169,127,0) 70%)"></div>
<div style="max-width: 1320px; margin: 0 auto; padding: 0 48px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 32px; position: relative">
<div style="max-width: 640px">
<div style="display: inline-flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; letter-spacing: .16em; color: #C9B49A; margin-bottom: 22px"><span style="width: 28px; height: 1px; background: #C9B49A"></span>WHAT WE DO BEST</div>
<h2 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-weight: 500; font-size: clamp(36px, 4vw, 58px); line-height: 1.04; letter-spacing: -0.035em; color: #fff">Complete care for <span class="serif" style="color: #EBD7BE">every</span> smile.</h2>
</div>
<div style="max-width: 360px; display: flex; flex-direction: column; gap: 20px; align-items: flex-start">
<p style="margin: 0; color: rgba(255,255,255,.72); font-size: 15px">From your first check-up to implants and smile makeovers — eight specialities, one trusted team.</p>
<a class="btn btn-white" href="#" style="min-height: 46px">All treatments</a>
</div>
</div>
<div class="scroller" style="overflow-x: auto; margin-top: 56px; padding: 0 48px 8px; scroll-snap-type: x mandatory">
<div style="display: flex; gap: 16px; width: max-content">
<sc-for list="{{services}}" as="s" hint-placeholder-count="8">
<a class="svc" href="#" style="width: 296px; flex-shrink: 0; scroll-snap-align: start; text-decoration: none; display: flex; flex-direction: column; gap: 10px">
