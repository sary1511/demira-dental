.field:focus{outline:none;border-color:#0B63CE;background:#fff;box-shadow:0 0 0 4px rgba(11,99,206,.16)}
.slot{flex:1 1 0;min-height:48px;border-radius:0;font:500 13px Inter,system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;transition:all .2s}
.slot-off{background:#F5F9FD;color:#0A1F3C;border:1px solid #D3DEEA}.slot-off:hover{border-color:#0B63CE}

.track{display:flex;gap:56px;width:max-content;animation:marq 38s linear infinite}
